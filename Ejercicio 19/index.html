<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Formulario multi-step</title>
</head>
<body>
  <h1>Registro</h1>

  <div class="wizard">
    <section id="paso1" class="paso paso-activo">
      <h2>Paso 1: datos personales</h2>
      <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required minlength="2">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="tu@email.com" required>

        <a href="#paso2" class="boton-siguiente">Siguiente</a>
      </form>
    </section>

    <section id="paso2" class="paso">
      <h2>Paso 2: contraseña</h2>
      <form>
        <label for="clave">Contraseña (mínimo 6 caracteres):</label>
        <input type="password" id="clave" placeholder="••••••" required minlength="6">

        <a href="#paso1" class="boton-siguiente">Volver atrás</a>
        <button type="submit">Finalizar registro</button>
      </form>
    </section>
  </div>
</body>
</html>
