<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Selectores CSS</title>
</head>
<body>
  <div class="card">
    <p>Párrafo dentro de una card</p>
    <span>Texto en span dentro de card</span>
  </div>

  <div id="destacado">
    <p>Párrafo dentro del div con id destacado</p>
  </div>

  <p>Párrafo suelto, fuera de cualquier div</p>
  <span>Span suelto</span>
</body>
</html>
